name: Build Abon Gulung Gembul APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [main, feature/online-hosting]
    paths:
      - 'android/**'
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate offline JavaScript
        run: |
          node --check backend/server.js
          node --check backend/daily-reports.js
          node --check backend/management.js
          node --check frontend/app.js
          bash -n scripts/start-termux.sh scripts/install-termux.sh scripts/update-and-restart.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Secrets are unavailable to pull_request builds from forks.
      - name: Prepare permanent release signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/katsucode-release.jks"
          chmod 600 "$RUNNER_TEMP/katsucode-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/katsucode-release.jks" >> "$GITHUB_ENV"

      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        run: gradle -p android --no-daemon assembleDebug

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        run: gradle -p android --no-daemon assembleRelease

      - name: Verify debug APK
        if: github.event_name == 'pull_request'
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Verify signed release APK
        if: github.event_name != 'pull_request'
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abon-Gulung-Gembul-Stok-Kertas-APK
          path: ${{ github.event_name == 'pull_request' && 'android/app/build/outputs/apk/debug/app-debug.apk' || 'android/app/build/outputs/apk/release/app-release.apk' }}
          if-no-files-found: error
          retention-days: 30
