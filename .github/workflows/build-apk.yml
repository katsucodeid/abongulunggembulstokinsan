name: Build Abon Gulung Gembul APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'frontend/**'
      - 'img/**'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [main, cobaapkmandiri]
    paths:
      - 'android/**'
      - 'frontend/**'
      - 'img/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  # Each build gets its own group so a newer request cannot cancel an active APK build.
  group: android-apk-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for launcher icon
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Generate launcher icon from bundled offline logo
        run: |
          python -m pip install --upgrade Pillow
          mkdir -p /tmp/gembul-icon
          cp img/BackgroundEraser_20261016_074306739.png /tmp/gembul-icon/source.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open("/tmp/gembul-icon/source.png").convert("RGBA")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          root = Path("android/app/src/main/res")
          for density, size in sizes.items():
              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.copy()
              icon.thumbnail((size, size), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              canvas.alpha_composite(icon, ((size-icon.width)//2, (size-icon.height)//2))
              canvas.save(folder / "ic_launcher.png", optimize=True)
              canvas.save(folder / "ic_launcher_round.png", optimize=True)
          PY

      - name: Bundle frontend and image assets for the standalone app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R frontend/. android/app/src/main/assets/www/
          mkdir -p android/app/src/main/assets/www/img
          cp -R img/. android/app/src/main/assets/www/img/
          test -s android/app/src/main/assets/www/index.html
          test -s android/app/src/main/assets/www/app.js
          test -s android/app/src/main/assets/www/img/BackgroundEraser_20261016_074306739.png
          echo "Bundled files:"
          find android/app/src/main/assets/www -type f -printf '%P %s bytes\n' | sort

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run embedded API integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            set -eux
            gradle -p android --no-daemon assembleDebug assembleDebugAndroidTest
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am instrument -w -r id.katsucode.wasmida.test/androidx.test.runner.AndroidJUnitRunner
            adb shell svc wifi enable

      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Verify debug APK exists and is signed
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Build and verify Wasmida-signed release APK 3.1.0
        if: github.ref == 'refs/heads/cobaapkmandiri' && github.event_name != 'pull_request'
        env:
          WASMIDA_KEYSTORE_BASE64: ${{ secrets.WASMIDA_KEYSTORE_BASE64 }}
          WASMIDA_STORE_PASSWORD: ${{ secrets.WASMIDA_STORE_PASSWORD }}
          WASMIDA_KEY_ALIAS: ${{ secrets.WASMIDA_KEY_ALIAS }}
          WASMIDA_KEY_PASSWORD: ${{ secrets.WASMIDA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in WASMIDA_KEYSTORE_BASE64 WASMIDA_STORE_PASSWORD WASMIDA_KEY_ALIAS WASMIDA_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required GitHub Actions secret $secret_name is missing."
              exit 1
            fi
          done

          KEYSTORE_DIR="$RUNNER_TEMP/wasmida-signing"
          KEYSTORE_PATH="$KEYSTORE_DIR/wasmida.jks"
          mkdir -p "$KEYSTORE_DIR"
          chmod 700 "$KEYSTORE_DIR"
          printf '%s' "$WASMIDA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          export WASMIDA_KEYSTORE_PATH="$KEYSTORE_PATH"
          gradle -p android --no-daemon assembleRelease

          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          CERT_OUTPUT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")
          printf '%s\n' "$CERT_OUTPUT"
          EXPECTED_CERT_SHA256="07d4dc8246a2d776ec650a0b52ef446009b683165b0ac4a0a0c76dce0e68f72d"
          if ! printf '%s\n' "$CERT_OUTPUT" | grep -qi "$EXPECTED_CERT_SHA256"; then
            echo "::error::Release APK certificate does not match the registered Wasmida certificate."
            exit 1
          fi
          echo "Wasmida signing certificate verified."
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Abon-Gulung-Gembul-Stok-Kertas-APK-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Wasmida release APK
        if: github.ref == 'refs/heads/cobaapkmandiri' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Abon-Gulung-Gembul-Wasmida-Stok-Kertas-3.1.0
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
