name: Build APK Abon Gulung Gembul Stok v3.1

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'frontend/**'
      - 'img/**'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for launcher icon
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Generate launcher icon from bundled offline logo
        run: |
          python -m pip install --upgrade Pillow
          mkdir -p /tmp/gembul-icon
          cp img/BackgroundEraser_20261016_074306739.png /tmp/gembul-icon/source.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open("/tmp/gembul-icon/source.png").convert("RGBA")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          root = Path("android/app/src/main/res")
          for density, size in sizes.items():
              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.copy()
              icon.thumbnail((size, size), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              canvas.alpha_composite(icon, ((size-icon.width)//2, (size-icon.height)//2))
              canvas.save(folder / "ic_launcher.png", optimize=True)
              canvas.save(folder / "ic_launcher_round.png", optimize=True)
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate frontend JavaScript
        run: node --check frontend/app.js

      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Verify APK exists
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" android/app/build/outputs/apk/debug/Abon-Gulung-Gembul-Stok-3.1.0.apk
          ls -lh android/app/build/outputs/apk/debug/Abon-Gulung-Gembul-Laporan-3.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abon-Gulung-Gembul-Stok-3.1.0-APK
          path: android/app/build/outputs/apk/debug/Abon-Gulung-Gembul-Laporan-3.0.0.apk
          if-no-files-found: error
          retention-days: 30
