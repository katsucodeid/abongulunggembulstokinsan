name: Build Abon Gulung Gembul APK
# Rebuild the Android wrapper after each offline UI and Termux updater change.

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate offline JavaScript
        run: |
          node --check backend/server.js
          node --check backend/daily-reports.js
          node --check backend/management.js
          node --check frontend/app.js
          bash -n scripts/start-termux.sh scripts/install-termux.sh scripts/update-and-restart.sh


      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Verify APK exists
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abon-Gulung-Gembul-Stok-Kertas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
