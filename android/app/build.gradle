plugins {
    id 'com.android.application'
}

android {
    namespace 'id.katsucode.abongulunggembulstokinsan'
    compileSdk 35

    defaultConfig {
        // Keep this application ID isolated from the original app while preserving
        // the identity of the existing separate installation and its local data.
        applicationId 'id.katsucode.wasmida.abongulunggembul.v0003'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.0.0.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
