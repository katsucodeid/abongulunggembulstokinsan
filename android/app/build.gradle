plugins {
    id 'com.android.application'
}

android {
    namespace 'id.katsucode.abongulunggembulstokinsan'
    compileSdk 35

    defaultConfig {
        // Keep this application ID isolated from the original app while preserving
        // the identity of the existing separate installation and its local data.
        applicationId 'id.katsucode.abongulunggembulstokinsan.separate'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '2.4.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
