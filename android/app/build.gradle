plugins {
    id 'com.android.application'
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

android {
    buildTypes {
        debug {
            // Keep preview installs isolated from the current production/Termux app.
            applicationIdSuffix '.preview'
        }
    }

    namespace 'id.katsucode.abongulunggembulstokinsan'
    compileSdk 35

    defaultConfig {
        applicationId 'id.katsucode.abongulunggembulstokinsan'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '2.2.0-local-preview'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
