services:
  - type: web
    name: gembul-stok-online
    runtime: node
    plan: starter
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: gembul-stock-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: insanadmin
      - key: ADMIN_PASSWORD
        sync: false
